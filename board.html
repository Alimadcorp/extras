<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Board Seat Finder</title>

<style>
*{box-sizing:border-box}
body{
  margin:0;
  font-family:system-ui;
  background:#0a0a0a;
  color:#eaeaea;
  -webkit-tap-highlight-color:transparent;
}

.container{max-width:900px;margin:auto;padding:12px}

h2{margin:10px 0;font-weight:600}

.card{
  background:#111;
  border:1px solid #222;
  border-radius:10px;
  padding:10px;
  margin:10px 0;
}

input,select,textarea{
  width:100%;
  padding:10px;
  margin:6px 0;
  background:#0d0d0d;
  border:1px solid #222;
  color:#fff;
  border-radius:8px;
  outline:none;
}

button{
  width:100%;
  padding:10px;
  margin:6px 0;
  background:#fff;
  color:#000;
  border:none;
  border-radius:8px;
  cursor:pointer;
  font-weight:600;
}

button:hover{opacity:0.85}

details{
  background:#111;
  border:1px solid #222;
  padding:8px;
  border-radius:8px;
  margin:6px 0;
}

summary{cursor:pointer}

.small{font-size:12px;color:#aaa}

.hidden{display:none}
</style>
</head>

<body>
<div class="container">

<h2>Board Seat Finder</h2>

<div class="card" id="countdown">Loading...</div>
<div class="card small" id="lastUpdate">Last update: --</div>

<!-- UPLOAD FIRST -->
<div class="card" id="uploadBox">
  <h3>Upload your info</h3>
  <p class="small">Please enter correct information. This platform is only for supportive use.</p>

  <input id="name" placeholder="Complete Name"/>
  <input id="boardRn" placeholder="Board Roll Number"/>
  <input id="center" placeholder="Exam Center"/>

  <select id="major">
    <option>ICS</option>
    <option>Pre Medical</option>
    <option>Pre Engineering</option>
    <option>ICOM</option>
    <option>Arts</option>
  </select>

  <select id="shift">
    <option>Morning</option>
    <option>Evening</option>
  </select>

  <button onclick="upload()">Upload</button>
</div>

<!-- LOCKED UNTIL UPLOAD -->
<div id="app" class="hidden">

<div class="card">
<h3>Search Seats</h3>
<input id="searchRn" placeholder="Board Roll No"/>
<button onclick="search()">Find Nearby</button>
<div id="results"></div>
</div>

<div class="card">
<h3>Comments</h3>
<textarea id="commentText" placeholder="Write comment..."></textarea>
<button onclick="postComment()">Post</button>
<div id="comments"></div>
</div>

</div>

</div>

<script>
const API = {
  upload:(d,s)=>`https://log.alimad.co/api/log?channel=boardsit&text=${encodeURIComponent(JSON.stringify(d))}&status=${s}`,
  fetch:`https://log.alimad.co/api/pull?channel=boardsit`
}

const EXAM_START = new Date("2026-05-21T00:00:00");
const EXAM_END = new Date("2026-06-12T23:59:59");

let cache = [];

function countdown(){
  const now = new Date();
  const el = document.getElementById("countdown");

  const diff = EXAM_START - now;

  if(diff > 0){
    const s = Math.floor(diff/1000)%60;
    const m = Math.floor(diff/60000)%60;
    const h = Math.floor(diff/3600000)%24;
    const d = Math.floor(diff/86400000);
    el.textContent = `Exam starts in ${d}d ${h}h ${m}m ${s}s`;
  }
  else if(now <= EXAM_END){
    el.textContent = "Exams ongoing. Stay focused.";
  }
  else{
    el.textContent = "Exams finished.";
  }
}
setInterval(countdown,1000);
countdown();

function setUploadedUI(){
  uploadBox.classList.add("hidden");
  app.classList.remove("hidden");
}

function get(id){
  return document.getElementById(id)
}

function upload(){
  const nameEl = get("name")
  const boardEl = get("boardRn")
  const centerEl = get("center")

  const data = {
    name: (nameEl?.value || "").trim(),
    boardRn: (boardEl?.value || "").trim(),
    center: (centerEl?.value || "").trim(),
    major: get("major")?.value,
    shift: get("shift")?.value,
    time: Date.now()
  }

  if(!data.name || !data.boardRn){
    alert("Fill required fields properly")
    return
  }

  localStorage.setItem("me", JSON.stringify(data))
  fetch(API.upload(data,"data"))

  setUploadedUI()
  loadData()
}

async function fetchData(){
  const res = await fetch(API.fetch);
  const json = await res.json();

  const logs = json.logs || [];
  const data = logs.filter(x=>x.status==="data").map(x=>{
    try{return JSON.parse(x.text)}catch{return null}
  }).filter(Boolean);

  const comments = logs.filter(x=>x.status==="comment").map(x=>{
    try{return JSON.parse(x.text)}catch{return null}
  }).filter(Boolean);

  cache = {data,comments,time:Date.now()};
  return cache;
}

async function loadData(){
  await fetchData();
  render();
}

function render(){
  const me = JSON.parse(localStorage.getItem("me")||"null");

  const sorted = [...cache.data].sort((a,b)=>a.boardRn-b.boardRn);

  const last = cache.data[cache.data.length-1];
  lastUpdate.textContent = last
    ? `Last update: ${Math.floor((Date.now()-last.time)/1000)}s ago`
    : "Last update: --";

  comments.innerHTML = cache.comments.slice(-10).reverse().map(c=>
    `<div class="card small">${c.text||""}</div>`
  ).join("");

  window.__students = sorted;
}

function search(){
  if(!window.__students) return;

  const target = parseInt(searchRn.value);
  const arr = window.__students;

  let idx = arr.findIndex(x=>parseInt(x.boardRn)===target);
  if(idx<0) idx=0;

  const slice = arr.slice(Math.max(0,idx-5),idx+6);

  results.innerHTML = slice.map(s=>
    `<details>
      <summary>${s.boardRn} - ${s.name}</summary>
      <div class="small">
        Center: ${s.center}<br/>
        Shift: ${s.shift}<br/>
        Major: ${s.major}
      </div>
    </details>`
  ).join("");
}

async function postComment(){
  const text = commentText.value.trim();
  if(!text) return;

  await fetch(API.upload({text},"comment"));
  commentText.value="";
  loadData();
}

(async function init(){
  const me = localStorage.getItem("me");
  if(me){
    setUploadedUI();
  }

  await loadData();
  setInterval(loadData,60000);
})();
</script>

</body>
</html>

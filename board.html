<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Board Seat Finder</title>

<style>
*{
  box-sizing:border-box;
}

:root{
  --bg:#070707;
  --card:#111;
  --soft:#171717;
  --border:#232323;
  --text:#f5f5f5;
  --muted:#9a9a9a;
  --green:#22c55e;
  --orange:#f59e0b;
  --blue:#3b82f6;
}

body{
  margin:0;
  background:var(--bg);
  color:var(--text);
  font-family:Inter,system-ui,sans-serif;
  -webkit-tap-highlight-color:transparent;
}

.container{
  width:min(920px,100%);
  margin:auto;
  padding:14px;
}

.card{
  background:var(--card);
  border:1px solid var(--border);
  border-radius:18px;
  padding:14px;
  margin-bottom:14px;
}

.title{
  font-size:28px;
  font-weight:800;
  margin-bottom:6px;
}

.subtitle{
  color:var(--muted);
  font-size:14px;
}

input,select,button{
  width:100%;
  margin-top:10px;
  border:none;
  outline:none;
  border-radius:14px;
  padding:14px;
  font-size:15px;
}

input,select{
  background:#0d0d0d;
  color:white;
  border:1px solid #202020;
}

button{
  background:white;
  color:black;
  font-weight:700;
  cursor:pointer;
}

button:hover{
  opacity:.92;
}

.grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:10px;
}

.student{
  background:var(--soft);
  border:1px solid #202020;
  border-radius:16px;
  padding:14px;
  margin-bottom:10px;
  transition:.15s;
}

.student:hover{
  transform:translateY(-1px);
}

.student.me{
  border-color:var(--green);
  background:#0d1711;
}

.student.orange{
  border-color:var(--orange);
}

.student.blue{
  border-color:var(--blue);
}

.top{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:10px;
}

.name{
  font-weight:800;
  font-size:17px;
}

.roll{
  color:#cfcfcf;
  font-size:13px;
}

.meta{
  margin-top:10px;
  color:var(--muted);
  font-size:14px;
  line-height:1.55;
}

.actions{
  display:flex;
  gap:10px;
}

.hidden{
  display:none;
}

.countdown{
  font-size:18px;
  font-weight:700;
}

.last{
  color:var(--muted);
  margin-top:5px;
  font-size:13px;
}

.sectionTitle{
  font-size:20px;
  font-weight:700;
  margin-bottom:8px;
}

@media(max-width:700px){
  .grid{
    grid-template-columns:1fr;
  }
}
</style>
</head>
<body>

<div class="container">

<div class="card">
  <div class="title">Board Seat Finder</div>
  <div class="subtitle">
    Find the students sitting around your board roll number.
  </div>

  <div class="countdown" id="countdown"></div>
  <div class="last" id="lastUpdate"></div>
</div>

<div class="card" id="setup">

  <div class="sectionTitle">Your Information</div>

  <div class="subtitle">
    Please enter correct information. This platform is entirely for supportive purposes.
  </div>

  <input id="name" placeholder="Complete Name">
  <input id="boardRn" placeholder="Board Roll Number">
  <input id="center" placeholder="Exam Center">
  <input id="phone" placeholder="Contact Number (Optional)">

  <div class="grid">
    <select id="major">
      <option>ICS</option>
      <option>Pre Medical</option>
      <option>Pre Engineering</option>
      <option>ICOM</option>
      <option>Arts</option>
    </select>

    <select id="shift">
      <option>Morning</option>
      <option>Evening</option>
    </select>
  </div>

  <button onclick="saveMe()">Continue</button>

</div>

<div id="app" class="hidden">

  <div class="card">
    <div class="actions">
      <button onclick="move(-7)">⬆ Previous 7</button>
      <button onclick="move(7)">⬇ Next 7</button>
    </div>
  </div>

  <div id="results"></div>

</div>

</div>

<script>
const API =
  "https://log.alimad.co/api/pull?channel=boardsit"

const UPLOAD =
  (d)=>
  `https://log.alimad.co/api/log?channel=boardsit&status=data&text=${encodeURIComponent(JSON.stringify(d))}`

const EXAM_START =
  new Date("2026-05-21T00:00:00")

const EXAM_END =
  new Date("2026-06-12T23:59:59")

let students = []
let centerIndex = 0

function $(id){
  return document.getElementById(id)
}

function countdown(){
  const now = new Date()

  if(now < EXAM_START){

    const diff = EXAM_START - now

    const d = Math.floor(diff / 86400000)
    const h = Math.floor(diff / 3600000) % 24
    const m = Math.floor(diff / 60000) % 60
    const s = Math.floor(diff / 1000) % 60

    $("countdown").textContent =
      `Exams start in ${d}d ${h}h ${m}m ${s}s`

  }else if(now <= EXAM_END){

    $("countdown").textContent =
      "Exams are ongoing. Good luck."

  }else{

    $("countdown").textContent =
      "Exams finished."

  }
}

setInterval(countdown,1000)
countdown()

async function fetchData(){

  try{

    const res = await fetch(API)
    const json = await res.json()

    students = (json.logs || [])
      .filter(x => x.status === "data")
      .map(x=>{
        try{
          return JSON.parse(x.text)
        }catch{
          return null
        }
      })
      .filter(Boolean)
      .filter(x => x.boardRn)
      .sort((a,b)=>
        Number(a.boardRn) - Number(b.boardRn)
      )

    $("lastUpdate").textContent =
      `Updated ${new Date().toLocaleTimeString()}`

    render()

  }catch(err){
    console.error(err)
  }
}

function saveMe(){

  const me = {
    name: $("name").value.trim(),
    boardRn: $("boardRn").value.trim(),
    center: $("center").value.trim(),
    phone: $("phone").value.trim(),
    major: $("major").value,
    shift: $("shift").value,
    time: Date.now()
  }

  if(!me.name || !me.boardRn){
    alert("Please fill required fields.")
    return
  }

  localStorage.setItem("boardsit_me", JSON.stringify(me))

  fetch(UPLOAD(me))

  $("setup").classList.add("hidden")
  $("app").classList.remove("hidden")

  locateMe()
  render()
}

function locateMe(){

  const me =
    JSON.parse(localStorage.getItem("boardsit_me") || "null")

  if(!me) return

  const idx =
    students.findIndex(x =>
      Number(x.boardRn) === Number(me.boardRn)
    )

  centerIndex =
    idx === -1 ? 0 : idx
}

function move(amount){

  centerIndex += amount

  if(centerIndex < 0)
    centerIndex = 0

  if(centerIndex >= students.length)
    centerIndex = students.length - 1

  render()
}

function render(){

  const me =
    JSON.parse(localStorage.getItem("boardsit_me") || "null")

  if(!me || !students.length)
    return

  const start =
    Math.max(0, centerIndex - 7)

  const end =
    Math.min(students.length, centerIndex + 8)

  const visible =
    students.slice(start, end)

  $("results").innerHTML =
    visible.map(student => {

      const mine =
        Number(student.boardRn) === Number(me.boardRn)

      let cls = "student"

      if(mine){

        cls += " me"

      }else{

        if(
          me.shift === "Morning" &&
          student.shift === "Evening"
        ){
          cls += " orange"
        }

        if(
          me.shift === "Evening" &&
          student.shift === "Morning"
        ){
          cls += " blue"
        }

      }

      return `
      <div class="${cls}">

        <div class="top">

          <div>
            <div class="name">
              ${student.name}
              ${mine ? " (You)" : ""}
            </div>

            <div class="roll">
              Roll No: ${student.boardRn}
            </div>
          </div>

        </div>

        <div class="meta">
          ${student.major || "-"} • ${student.shift || "-"}<br>
          ${student.center || "-"}
          ${
            student.phone
            ? `<br>${student.phone}`
            : ""
          }
        </div>

      </div>
      `
    }).join("")
}

function init(){

  const me =
    JSON.parse(localStorage.getItem("boardsit_me") || "null")

  if(me){

    $("setup").classList.add("hidden")
    $("app").classList.remove("hidden")

  }

  fetchData()

  setInterval(fetchData,60000)

  setTimeout(()=>{
    locateMe()
    render()
  },500)
}

init()
</script>

</body>
</html>

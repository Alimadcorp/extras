<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Board Seat Finder</title>

<style>
*{
  box-sizing:border-box;
}

:root{
  --bg:#050505;
  --card:#0d0d0d;
  --border:#1a1a1a;
  --text:#f5f5f5;
  --muted:#7d7d7d;
  --highlight:#ffffff;
}

body{
  margin:0;
  background:var(--bg);
  color:var(--text);
  font-family:Inter,system-ui,sans-serif;
  -webkit-tap-highlight-color:transparent;
}

.app{
  width:min(700px,100%);
  margin:auto;
  padding:12px;
}

.block{
  background:var(--card);
  border:1px solid var(--border);
  border-radius:18px;
  padding:14px;
  margin-bottom:12px;
}

.title{
  font-size:28px;
  font-weight:800;
  letter-spacing:-1px;
}

.sub{
  color:var(--muted);
  margin-top:4px;
  font-size:14px;
  line-height:1.5;
}

.countdown{
  margin-top:12px;
  font-size:15px;
  font-weight:700;
}

.last{
  margin-top:4px;
  color:var(--muted);
  font-size:12px;
}

input,select,button{
  width:100%;
  margin-top:10px;
  border:none;
  outline:none;
  border-radius:14px;
  padding:14px;
  font-size:15px;
}

input,select{
  background:#090909;
  border:1px solid #181818;
  color:white;
}

button{
  background:white;
  color:black;
  font-weight:800;
  cursor:pointer;
}

.row{
  display:flex;
  gap:8px;
}

.feed{
  display:flex;
  flex-direction:column;
  gap:8px;
}

.student{
  background:#090909;
  border:1px solid #181818;
  border-radius:16px;
  padding:14px;
  transition:.15s;
}

.student.same{
  border-color:#ffffff;
  background:#111;
}

.student.me{
  border-color:#ffffff;
}

.top{
  display:flex;
  justify-content:space-between;
  gap:12px;
}

.name{
  font-size:16px;
  font-weight:750;
}

.roll{
  color:#b5b5b5;
  font-size:13px;
  margin-top:2px;
}

.meta{
  margin-top:10px;
  color:#8d8d8d;
  font-size:13px;
  line-height:1.5;
}

.hidden{
  display:none;
}

.nav{
  display:flex;
  gap:8px;
  margin-bottom:12px;
}

.smallBtn{
  flex:1;
}

.centerMarker{
  height:1px;
  background:#fff;
  opacity:.08;
  margin:6px 0;
}
</style>
</head>
<body>

<div class="app">

<div class="block">

  <div class="title">Board Seat Finder</div>

  <div class="sub">
    Find nearby students sitting around your roll number.
  </div>

  <div class="countdown" id="countdown"></div>
  <div class="last" id="lastUpdate"></div>

</div>

<div class="block" id="setup">

  <div class="sub">
    Please enter correct information. This platform is entirely for supportive purposes.
  </div>

  <input id="name" placeholder="Complete Name">
  <input id="boardRn" placeholder="Board Roll Number">
  <input id="center" placeholder="Exam Center">
  <input id="phone" placeholder="Contact Number (Optional)">

  <div class="row">
    <select id="major">
      <option>ICS</option>
      <option>Pre Medical</option>
      <option>Pre Engineering</option>
      <option>ICOM</option>
      <option>Arts</option>
    </select>

    <select id="shift">
      <option>Morning</option>
      <option>Evening</option>
    </select>
  </div>

  <button onclick="saveMe()">Continue</button>

</div>

<div id="main" class="hidden">

  <div class="nav">
    <button class="smallBtn" onclick="move(-7)">↑ Previous</button>
    <button class="smallBtn" onclick="move(7)">Next ↓</button>
  </div>

  <div class="feed" id="feed"></div>

</div>

</div>

<script>
const API =
  "https://log.alimad.co/api/pull?channel=boardsit"

const UPLOAD =
  d =>
  `https://log.alimad.co/api/log?channel=boardsit&status=data&text=${encodeURIComponent(JSON.stringify(d))}`

const EXAM_START =
  new Date("2026-05-21T00:00:00")

const EXAM_END =
  new Date("2026-06-12T23:59:59")

let students = []
let cursor = 0

function $(id){
  return document.getElementById(id)
}

function updateCountdown(){

  const now = new Date()

  if(now < EXAM_START){

    const diff = EXAM_START - now

    const d = Math.floor(diff/86400000)
    const h = Math.floor(diff/3600000)%24
    const m = Math.floor(diff/60000)%60
    const s = Math.floor(diff/1000)%60

    $("countdown").textContent =
      `${d}d ${h}h ${m}m ${s}s until exams`

  }else if(now <= EXAM_END){

    $("countdown").textContent =
      "Exams ongoing"

  }else{

    $("countdown").textContent =
      "Exams finished"

  }
}

setInterval(updateCountdown,1000)
updateCountdown()

async function fetchData(){

  try{

    const res = await fetch(API)
    const json = await res.json()

    const raw =
      (json.logs || [])
      .filter(x => x.status === "data")
      .map(x=>{
        try{
          return JSON.parse(x.text)
        }catch{
          return null
        }
      })
      .filter(Boolean)
      .filter(x => x.boardRn)

    const deduped = new Map()

    for(const s of raw){

      const key =
        Number(s.boardRn)

      const existing =
        deduped.get(key)

      if(!existing || (s.time || 0) > (existing.time || 0)){
        deduped.set(key,s)
      }
    }

    students =
      [...deduped.values()]
      .sort((a,b)=>
        Number(a.boardRn) - Number(b.boardRn)
      )

    $("lastUpdate").textContent =
      `Updated ${new Date().toLocaleTimeString()}`

    locateMe()
    render()

  }catch(err){
    console.error(err)
  }
}

function saveMe(){

  const me = {
    name:$("name").value.trim(),
    boardRn:$("boardRn").value.trim(),
    center:$("center").value.trim(),
    phone:$("phone").value.trim(),
    major:$("major").value,
    shift:$("shift").value,
    time:Date.now()
  }

  if(!me.name || !me.boardRn){
    alert("Fill required fields")
    return
  }

  localStorage.setItem(
    "boardsit_me",
    JSON.stringify(me)
  )

  fetch(UPLOAD(me))

  $("setup").classList.add("hidden")
  $("main").classList.remove("hidden")

  locateMe()
  render()
}

function locateMe(){

  const me =
    JSON.parse(localStorage.getItem("boardsit_me") || "null")

  if(!me || !students.length)
    return

  const idx =
    students.findIndex(
      x => Number(x.boardRn) === Number(me.boardRn)
    )

  cursor =
    idx === -1
    ? 0
    : idx
}

function move(amount){

  cursor += amount

  if(cursor < 0)
    cursor = 0

  if(cursor >= students.length)
    cursor = students.length - 1

  render(true)
}

function render(scroll=false){

  const me =
    JSON.parse(localStorage.getItem("boardsit_me") || "null")

  if(!me || !students.length)
    return

  const start =
    Math.max(0,cursor-7)

  const end =
    Math.min(students.length,cursor+8)

  const visible =
    students.slice(start,end)

  $("feed").innerHTML =
    visible.map(student=>{

      const mine =
        Number(student.boardRn) === Number(me.boardRn)

      const sameShift =
        student.shift === me.shift

      return `
      <div
        class="
          student
          ${mine ? "me" : ""}
          ${sameShift ? "same" : ""}
        "
        data-roll="${student.boardRn}"
      >

        <div class="top">

          <div>

            <div class="name">
              ${student.name}
              ${mine ? "(You)" : ""}
            </div>

            <div class="roll">
              ${student.boardRn}
            </div>

          </div>

        </div>

        <div class="meta">
          ${student.major || "-"} • ${student.shift || "-"}<br>
          ${student.center || "-"}
          ${
            student.phone
            ? `<br>${student.phone}`
            : ""
          }
        </div>

      </div>
      `
    }).join("")

  if(scroll){

    const meCard =
      document.querySelector(".student.me")

    if(meCard){

      meCard.scrollIntoView({
        behavior:"smooth",
        block:"center"
      })

    }

  }
}

function init(){

  const me =
    JSON.parse(localStorage.getItem("boardsit_me") || "null")

  if(me){

    $("setup").classList.add("hidden")
    $("main").classList.remove("hidden")

  }

  fetchData()

  setInterval(fetchData,60000)
}

init()
</script>

</body>
</html>
